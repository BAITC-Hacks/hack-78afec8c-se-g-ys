[project]
name = "qala-draft"
version = "0.1.0"
description = "Catalogue-injected draft validation for QALA"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["httpx2", "mypy>=1.15,<2", "pytest>=8,<10", "uvicorn>=0.34,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/qala_draft"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests", "examples"]
